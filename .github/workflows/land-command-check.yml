name: Land command checks

on:
  push:
    paths: ['src/**', 'Cargo.toml', '.github/workflows/land-command-check.yml']
  pull_request:
    paths: ['src/**', 'Cargo.toml', '.github/workflows/land-command-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust checks
        run: |
          rustup component add rustfmt clippy
          rustup target add aarch64-linux-android
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets
      - run: cargo test --all-targets
      - name: Check Android Rust code (SDK/NDK linking is separate)
        run: cargo check --all-targets --target aarch64-linux-android
      - run: cargo build --release --bin hoi4-mobile
