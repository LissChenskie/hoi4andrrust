name: Rust validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format Rust sources in the CI workspace
        run: cargo fmt --all
      - name: Run unit tests
        run: cargo test --all-targets
      - name: Check application
        run: cargo check
