name: Exporter PowerShell check

on:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/exporter-check.yml'
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/exporter-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows PowerShell 5.1 exporter invocation
        shell: powershell
        run: .\tools\tests\Test-Export-Hoi4Research.ps1
      - name: Check PowerShell 7 exporter invocation
        shell: pwsh
        run: .\tools\tests\Test-Export-Hoi4Research.ps1
