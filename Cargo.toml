[package]
name = "hoi4-mobile"
version = "0.1.0"
edition = "2024"
description = "An independent Rust grand-strategy prototype with a province-map viewer"
license = "MIT"
default-run = "hoi4-mobile"

[dependencies]
macroquad = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "tga"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
